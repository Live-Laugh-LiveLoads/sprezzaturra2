name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ["ci-logs/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# contents: write lets a failed run publish its Gradle log to the ci-logs branch, so it can be
# read with plain git (handy when the Actions log viewer is not reachable).
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.IDEAFORGE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --continue :core:test testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-log.sh build build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: idea-forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Signed release build, only when the keystore secrets are configured (see README).
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.IDEAFORGE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          IDEAFORGE_KEYSTORE: ${{ runner.temp }}/release.jks
          IDEAFORGE_KEYSTORE_PASSWORD: ${{ secrets.IDEAFORGE_KEYSTORE_PASSWORD }}
          IDEAFORGE_KEY_ALIAS: ${{ secrets.IDEAFORGE_KEY_ALIAS }}
          IDEAFORGE_KEY_PASSWORD: ${{ secrets.IDEAFORGE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idea-forge-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  instrumented:
    name: End-to-end test on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: set -o pipefail; ./gradlew connectedDebugAndroidTest --stacktrace 2>&1 | tee instrumented.log

      - name: Publish instrumented log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-log.sh instrumented instrumented.log

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
