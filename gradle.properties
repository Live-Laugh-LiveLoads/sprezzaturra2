org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Set to false to skip building the whisper.cpp native library (on-device transcription then
# reports itself as unavailable in Settings). Saves ~5 minutes of CI time and ~1.5 MB of APK.
ideaforge.whisperNative=true
